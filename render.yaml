# Render Blueprint: MANTIS, one web service (PayPal AI Hackathon).
#
# Render -> New -> Blueprint -> this repo. Values marked `sync: false` are asked
# for once in the dashboard and never stored in git. See docs/deploy_render.md.
services:
  - type: web
    name: mantis
    runtime: docker
    # Free: no card needed. Measured 51 MB idle, 164 MB after a dashboard load,
    # a playground replay and a Verify, against 512 MB. It sleeps after 15 idle
    # minutes and wakes on the next request, and it has no persistent disk.
    # Paid upgrade (never sleeps, state survives restarts): `plan: standard` plus
    #   disk: {name: mantis-runtime, mountPath: /var/data, sizeGB: 1}
    plan: free
    # US: the PayPal sandbox and the LLM router are both US-hosted.
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # -- behaviour -----------------------------------------------------------
      - key: MANTIS_PAYPAL_MODE
        value: live            # the PayPal SANDBOX; production is not configurable
      - key: MANTIS_PUBLIC
        value: "1"             # daily caps on
      - key: MANTIS_LIVE_DISABLED
        value: "0"             # kill switch: set to 1 to replay recorded runs only
      - key: MANTIS_RUNTIME_DIR
        value: /var/data       # the container's own filesystem on free: reset on sleep
      - key: MANTIS_STORE_VARIANT
        value: poisoned
      - key: MANTIS_CAP_RUNS
        value: "100"
      - key: MANTIS_RATE_PER_MIN
        value: "60"
      - key: LLM_PROVIDER
        value: fastrouter
      - key: FASTROUTER_BASE_URL
        value: https://api.fastrouter.ai/api/v1
      - key: LLM_MODEL_AGENT
        value: openai/gpt-4.1-mini
      - key: LLM_MODEL_JUDGE
        value: anthropic/claude-sonnet-4.6
      - key: LLM_MODEL_COMPILER
        value: anthropic/claude-sonnet-4.6
      # -- secrets: entered once in the Render dashboard -----------------------
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: FASTROUTER_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: MANTIS_MANDATE_KEY
        generateValue: true    # HMAC key for mandate signatures, random per service
