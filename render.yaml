# Render Blueprint: MANTIS, one always-on web service (PayPal AI Hackathon).
#
# Render -> New -> Blueprint -> this repo. Values marked `sync: false` are asked
# for once in the dashboard and never stored in git. See docs/deploy_render.md.
services:
  - type: web
    name: mantis
    runtime: docker
    # Starter (0.5 CPU / 512 MB, $7/mo, from the hackathon credit). Measured 51 MB
    # idle and 164 MB after a dashboard load, a playground replay and a Verify.
    # Paid, so it never sleeps, and it can carry the disk below.
    plan: starter
    # US: the PayPal sandbox and the LLM router are both US-hosted.
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # Gate log, receipts, quota counters, playground candidates: survive restarts
    # and deploys. A disk means one instance and a few seconds' gap per deploy.
    disk:
      name: mantis-runtime
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # -- behaviour -----------------------------------------------------------
      - key: MANTIS_PAYPAL_MODE
        value: live            # the PayPal SANDBOX; production is not configurable
      - key: MANTIS_PUBLIC
        value: "1"             # daily caps on
      - key: MANTIS_LIVE_DISABLED
        value: "0"             # kill switch: set to 1 to replay recorded runs only
      - key: MANTIS_RUNTIME_DIR
        value: /var/data       # the persistent disk above
      - key: MANTIS_WARM
        value: "1"             # fit the scorers at startup, not on a woken visitor's clock
      - key: MANTIS_STORE_VARIANT
        value: poisoned
      - key: MANTIS_CAP_RUNS
        value: "100"
      - key: MANTIS_RATE_PER_MIN
        value: "60"
      - key: LLM_PROVIDER
        value: fastrouter
      - key: FASTROUTER_BASE_URL
        value: https://api.fastrouter.ai/api/v1
      - key: LLM_MODEL_AGENT
        value: openai/gpt-4.1-mini
      - key: LLM_MODEL_JUDGE
        value: anthropic/claude-sonnet-4.6
      - key: LLM_MODEL_COMPILER
        value: anthropic/claude-sonnet-4.6
      # -- secrets: entered once in the Render dashboard -----------------------
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: FASTROUTER_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: MANTIS_MANDATE_KEY
        generateValue: true    # HMAC key for mandate signatures, random per service
